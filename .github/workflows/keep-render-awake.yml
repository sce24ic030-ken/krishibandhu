name: Keep Render Awake

# Render free-tier web services spin down after ~15 minutes of
# inactivity. This scheduled job pings the backend health endpoint
# (and the frontend) every 10 minutes so the cold-start wait
# (~30-60 s) never hits real users.

on:
  schedule:
    # Every 10 minutes — stays under Render's 15-minute idle window.
    - cron: '*/10 * * * *'
  workflow_dispatch: # manual "Run workflow" button on GitHub

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        run: curl -fsS --max-time 30 https://krishibandhu-api.onrender.com/api/health
        continue-on-error: true

      - name: Ping frontend
        run: curl -fsS --max-time 30 https://krishibandhu-frontend-833m.onrender.com/login
        continue-on-error: true